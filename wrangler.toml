name = "goaxis-consultancy"
compatibility_date = "2026-10-17"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "goaxis-consultancy-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "goaxis-customer-documents"

[vars]
CASHFREE_ENV = "sandbox"
